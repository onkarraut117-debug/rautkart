server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames never change contents, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Send API calls to the backend container. "backend" resolves over the
    # Compose network - the same trick the Vite proxy plays in development,
    # so the browser only ever sees one origin and CORS never applies.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router owns the URLs. Anything that is not a real file falls back
    # to index.html, otherwise refreshing on /orders/3 would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

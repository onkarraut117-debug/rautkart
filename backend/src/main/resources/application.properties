spring.application.name=rautkart-backend
server.port=8080

# --- Database -------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/rautkart
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# set to true while developing if you want to see the generated SQL
spring.jpa.show-sql=false

# --- JWT ------------------------------------------------------------------
# Base64-encoded 256-bit secret, used to sign JWTs.
#
# The fallback below is a PUBLIC PLACEHOLDER so a fresh clone runs. Anyone who
# reads this repository knows it, and could therefore forge tokens - including
# admin tokens. Set the JWT_SECRET environment variable before exposing this
# anywhere. Generate one with:  openssl rand -base64 32
rautkart.jwt.secret=${JWT_SECRET:cmF1dGthcnQtbG9jYWwtZGV2LXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNlLTEyMzQ1Ng==}
# 7 days in milliseconds
rautkart.jwt.expiration-ms=604800000

# --- CORS -----------------------------------------------------------------
rautkart.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# --- Razorpay (TEST MODE ONLY) -------------------------------------------
# Leave blank to run checkout in "mock payment" mode - no Razorpay call is made.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# --- Store settings -------------------------------------------------------
rautkart.delivery-fee=30.00
rautkart.free-delivery-above=500.00

# --- Health -------------------------------------------------------------
# Only the health endpoint is exposed; the rest of actuator stays closed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
